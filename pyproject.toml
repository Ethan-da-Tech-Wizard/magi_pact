[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-pact"
version = "1.0.0"
description = "Serverless, decentralized multi-agent consensus and message exchange for heterogeneous AI clusters"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "Magi Mesh Developers"}
]
keywords = ["multi-agent", "consensus", "distributed-systems", "p2p", "federated-mesh", "ai-coordination"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/magi-pact/magi_pact"
Repository = "https://github.com/magi-pact/magi_pact.git"

[project.scripts]
magi = "pact.cli:main"
magi-pact = "pact.cli:main"

[tool.setuptools.packages.find]
include = ["pact*"]
